<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Richard Lebotsa's web developer portfolio" />
    <title>Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="header">
        <h1>Contact Me</h1>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-section">
            <h2>Get In Touch</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" name="name" placeholder="Enter your name" id="name" required autocomplete="name"
                    aria-label="Full name">

                <label for="email1">Email:</label>
                <input type="email" name="email1" placeholder="Enter your email" id="email1" required
                    autocomplete="email" aria-label="Email address">

                <label for="phoneNumber">Phone Number:</label>
                <input type="tel" name="phoneNumber" id="phoneNumber" placeholder="e.g 0725463458" required
                    autocomplete="tel" pattern="[0-9]{10}" title="Enter a 10 digit phone number"
                    aria-label="Phone number">

                <fieldset aria-label="Preferred contact method">
                    <legend>Preferred contact method</legend>
                    <label for="email">
                        <input type="radio" name="contact" id="email">Email
                    </label>
                    <label for="phone">
                        <input type="radio" name="contact" id="phone">Phone
                    </label>
                </fieldset>

                <label for="subject">Subject:</label>
                <select name="subject" id="subject" required aria-label="Message subject">
                    <option value="">Select an option</option>
                    <option value="geenral">General</option>
                    <option value="feedback">Feedback</option>
                    <option value="job">Potential job</option>
                </select>

                <label for="message">Message:</label>
                <textarea name="message" placeholder="Write your message here..." id="message" rows="3" required
                    aria-label="Message content"></textarea>

                <!-- Missing: labels, more input types, validation -->

                <button type="submit" aria-label="Send message button">Send</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>Contact me at <a href="mailto:richardcodez23@gmail.com">richardcodez23@gmail.com</a></p>
        <p>&copy;2026 Richardcodez</p>
    </footer>
</body>

</html>
